# conda environment for LLaVA-OneVision-1.5 + BIMBA-Motion
#
# Create with:
#   conda env create -f environment_bimba_motion.yml
#
# Or on Anvil (recommended — uses the existing qwen env as base):
#   conda create --name ov15_bimba --clone qwen
#   conda activate ov15_bimba
#   pip install mamba-ssm causal-conv1d  # for true Mamba selective scan (GPU required)
#
# Minimal GPU-only install (no Mamba SSM):
#   conda create --name ov15_bimba --clone qwen
#   # The attention-based fallback in bimba_motion.py works without mamba-ssm.

name: ov15_bimba

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch::pytorch=2.3.*
  - pytorch::torchvision
  - nvidia::cudatoolkit=12.1
  - pip

  - pip:
    # Core
    - transformers>=4.53.1
    - accelerate>=1.9.0
    - datasets>=2.19.2
    - tokenizers>=0.21.0
    - safetensors>=0.4.3

    # Vision / video
    - qwen_vl_utils
    - timm>=1.0.3
    - pillow
    - opencv-python-headless
    - av                          # PyAV for video decoding
    - decord                      # fast video frame sampling

    # Training utilities
    - deepspeed>=0.14.0
    - peft>=0.11.0
    - einops>=0.6.0
    - sentencepiece>=0.1.98

    # Logging / misc
    - wandb>=0.21.0
    - tqdm
    - numpy

    # OPTIONAL: True Mamba selective scan (requires CUDA + compilation)
    # Uncomment after activating the environment on a GPU node:
    # - mamba-ssm>=2.2.2
    # - causal-conv1d>=1.4.0
